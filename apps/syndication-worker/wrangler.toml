name = "sunshade-syndication-worker"
main = "src/index.ts"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

routes = [
  { pattern = "publish.sunshade.icu", custom_domain = true }
]

[vars]
SERVICE_NAME = "sunshade-syndication"
LINKS_API_URL = "https://links.sunshade.icu"
BUILD_TIME = "2026-11-12T00:00:00Z"

[triggers]
crons = [
  "*/30 * * * *", # Substack RSS poller (every 30 minutes)
  "0 6 * * *"     # Daily OAuth token expiry scanner (06:00 UTC)
]

# Required runtime secrets (configure via `wrangler secret put <NAME>`):
# - SUPABASE_URL
# - SUPABASE_SERVICE_ROLE_KEY
# - PGSODIUM_KEY_ID
# - LINKS_API_URL
# - MASTER_API_KEY / SUNSHADE_MASTER_API_KEY
# - TRACKER_WEBHOOK_SECRET
# - INTERNAL_HEALTH_TOKEN

# Staging Environment
[env.staging]
name = "sunshade-syndication-worker-stag"
routes = [
  { pattern = "publish-stag.sunshade.icu", custom_domain = true }
]

[env.staging.vars]
SERVICE_NAME = "sunshade-syndication"
LINKS_API_URL = "https://links-stag.sunshade.icu"
BUILD_TIME = "2026-11-12T00:00:00Z"

# Production Environment
[env.production]
name = "sunshade-syndication-worker"
routes = [
  { pattern = "publish.sunshade.icu", custom_domain = true }
]

[env.production.vars]
SERVICE_NAME = "sunshade-syndication"
LINKS_API_URL = "https://links.sunshade.icu"
BUILD_TIME = "2026-11-12T00:00:00Z"

